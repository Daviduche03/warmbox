# A screenless image: Alpine plus the agent and the tools it and its users
# reach for — no X server, no session, no browser. The guest reports ready as
# soon as its agent is listening, so there is no console to open; it is reached
# through the agent API (exec/files/runs).
#
# `headless: true` bakes a marker into the guest (/etc/warmbox/headless), which
# is what /init reads to skip the display stack, and it lands in meta.json,
# which is how the daemon knows not to offer a screen. Keeping `desktop: none`
# and `headless: true` together is enforced by validation: one says what is
# installed, the other what runs.
name: headless
engine: overlay
desktop: none
theme: default
browser: none
headless: true
publish: true
