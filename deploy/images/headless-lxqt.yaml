# A screenless LXQt-based image: same idea as `headless` with the other session
# layer. Kept as its own entry rather than expanded from lxqt.yaml so the
# registry lists exactly what is installed and buildable — no magic.
name: headless-lxqt
engine: overlay
desktop: lxqt
theme: ambiance
browser: chromium
headless: true
publish: true
