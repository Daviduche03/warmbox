<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workspace Dashboard</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --accent:#38bdf8; --text:#e2e8f0; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); }
  header { padding:20px 28px; border-bottom:1px solid #334155; display:flex; justify-content:space-between; align-items:baseline; }
  h1 { font-size:20px; margin:0; }
  header span { color:#94a3b8; font-size:13px; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; padding:24px 28px; }
  .card { background:var(--card); border:1px solid #334155; border-radius:10px; padding:16px 18px; }
  .card h2 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:#94a3b8; margin:0 0 8px; }
  .card .v { font-size:28px; font-weight:600; }
  .panel { margin:0 28px 28px; background:var(--card); border:1px solid #334155; border-radius:10px; padding:18px; }
  .bar { height:12px; border-radius:6px; background:var(--accent); margin:6px 0; }
  .row { display:flex; align-items:center; gap:12px; font-size:13px; color:#cbd5e1; }
  .row .label { width:120px; }
  footer { padding:12px 28px; color:#64748b; font-size:12px; }
</style>
</head>
<body>
  <header>
    <h1>Workspace Dashboard</h1>
    <span id="clock"></span>
  </header>
  <div class="grid">
    <div class="card"><h2>Open tasks</h2><div class="v" id="tasks">0</div></div>
    <div class="card"><h2>Installed apps</h2><div class="v" id="apps">0</div></div>
    <div class="card"><h2>Volume</h2><div class="v">8&nbsp;GiB</div></div>
  </div>
  <div class="panel">
    <h2 style="font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#94a3b8;margin:0 0 12px">This week</h2>
    <div id="chart"></div>
  </div>
  <footer>Built by an agent and installed with warmbox-app. Data is stored in this browser profile on the volume.</footer>
<script>
  const week = [4, 9, 6, 12, 7, 3, 10];
  const days = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  const max = Math.max(...week);
  document.getElementById("chart").innerHTML = week.map((v,i) =>
    `<div class="row"><span class="label">${days[i]}</span>
     <div class="bar" style="width:${(v/max*70).toFixed(0)}%"></div>
     <span>${v}</span></div>`).join("");

  // Persist a couple of numbers in localStorage (on the volume) to show state.
  let tasks = +(localStorage.getItem("tasks") ?? 0);
  document.getElementById("tasks").textContent = tasks;
  document.getElementById("tasks").style.cursor = "pointer";
  document.getElementById("tasks").title = "Click to +1";
  document.getElementById("tasks").onclick = () => {
    tasks++; localStorage.setItem("tasks", tasks);
    document.getElementById("tasks").textContent = tasks;
  };
  document.getElementById("apps").textContent = "3";
  const tick = () => document.getElementById("clock").textContent = new Date().toLocaleString();
  tick(); setInterval(tick, 1000);
</script>
</body>
</html>
