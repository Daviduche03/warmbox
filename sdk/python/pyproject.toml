[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "warmbox"
version = "0.5.4"
description = "Typed Python client for the warmbox REST API"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

[project.urls]
Repository = "https://github.com/Daviduche03/warmbox"

[tool.setuptools.package-data]
warmbox = ["py.typed"]
