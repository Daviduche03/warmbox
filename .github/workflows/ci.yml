name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  python-sdk:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install build mypy
      - run: python -m mypy --strict warmbox
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - run: cd /tmp && python -c 'from warmbox import WarmboxClient, APIError'

  typescript-sdk:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 22]
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm pack
      - run: |
          version=$(node -p 'require("./package.json").version')
          package="$PWD/warmbox-$version.tgz"
          cd "$(mktemp -d)"
          npm install "$package"
          node --input-type=module -e 'import { WarmboxClient, APIError } from "warmbox"'
