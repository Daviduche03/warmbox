name: release

# Tag-driven: push v0.2.0 and this builds the CLI for darwin/arm64 and
# linux/{amd64,arm64}, publishes the tarballs + checksums, and updates the
# Homebrew tap.
#
# The guest image is published separately (see guest-image.yml) because it is a
# few hundred MB and has to be built once per architecture.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # goreleaser needs the full history for the changelog.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A PAT with write access to Daviduche03/homebrew-warmbox; the default
          # token cannot push to another repository.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
