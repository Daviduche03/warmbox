name: guest image

# Publishes the guest image to an existing release, one asset per architecture.
#
#   warmbox-image-<tag>-<goarch>.tar.zst  (+ .sha256)
#
# Those names are exactly what `warmbox setup` looks for, so the tag and the
# asset must agree.
#
# Manual on purpose: the build takes ~15 minutes per architecture and a failure
# here must never be able to block a binary release. Run it after the release
# workflow has created the release.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the image to (e.g. v0.2.0)"
        required: true
        type: string
      arch:
        description: "Which guest image(s) to build"
        required: true
        default: amd64
        type: choice
        options: [amd64, arm64, both]

permissions:
  contents: write

jobs:
  amd64:
    if: ${{ inputs.arch == 'amd64' || inputs.arch == 'both' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Builds vmlinux + initramfs.zst + rootfs.squashfs (+ overlay initramfs
      # and volume-base.img) into ~/.warmbox.
      - name: Build the guest image
        env:
          PLATFORM: linux/amd64
        run: ./deploy/guest/build.sh

      - name: Pack it (adds the .sha256 beside the archive)
        run: |
          go build -o warmbox ./cmd/warmbox
          ./warmbox image pack --builtin -o "warmbox-image-${{ inputs.tag }}-amd64.tar.zst"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ inputs.tag }}" \
            "warmbox-image-${{ inputs.tag }}-amd64.tar.zst" \
            "warmbox-image-${{ inputs.tag }}-amd64.tar.zst.sha256" \
            --clobber

  arm64:
    # ubuntu-24.04-arm is GitHub's free arm64 runner for *public* repositories.
    # A private repository cannot use it, so build the arm64 image on an Apple
    # Silicon Mac instead — which is where the guest image already lives:
    #
    #   make image-pack VERSION=v0.2.0
    #   gh release upload v0.2.0 warmbox-image-v0.2.0-arm64.tar.zst \
    #       warmbox-image-v0.2.0-arm64.tar.zst.sha256
    if: ${{ inputs.arch == 'arm64' || inputs.arch == 'both' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build the guest image
        env:
          PLATFORM: linux/arm64
        run: ./deploy/guest/build.sh

      - name: Pack it (adds the .sha256 beside the archive)
        run: |
          go build -o warmbox ./cmd/warmbox
          ./warmbox image pack --builtin -o "warmbox-image-${{ inputs.tag }}-arm64.tar.zst"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ inputs.tag }}" \
            "warmbox-image-${{ inputs.tag }}-arm64.tar.zst" \
            "warmbox-image-${{ inputs.tag }}-arm64.tar.zst.sha256" \
            --clobber
