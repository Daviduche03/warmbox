name: guest image

# Publishes the guest images to a fixed "images" release, one asset per image
# per architecture:
#
#   warmbox-image-<name>-<goarch>.tar.zst  (+ .sha256)
#
# The tag is deliberately not the version: the guest changes far less often than
# the CLI, and `warmbox setup` looks for these names, so a new release does not
# need hundreds of MB re-uploaded. Run this only when a guest actually changes.
#
# Which images ship is not decided here: `warmbox image build --publishable`
# asks the registry in deploy/images/. Adding an image is a config file plus a
# `publish: true`, not an edit to this workflow.
#
# Manual on purpose: every image is minutes of build per architecture, and a
# failure here must never be able to block a binary release.

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Which guest image(s) to build"
        required: true
        default: both
        type: choice
        options: [both, amd64, arm64]
      images:
        description: "Image names, space-separated (empty = every publish: true image)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  amd64:
    if: ${{ inputs.arch == 'amd64' || inputs.arch == 'both' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - run: go build -o warmbox ./cmd/warmbox

      - name: Ask the registry which images ship
        id: which
        run: |
          images="${{ inputs.images }}"
          if [ -z "$images" ]; then
            images="$(./warmbox image build --publishable | tr '\n' ' ')"
          fi
          echo "building: $images"
          echo "names=$images" >> "$GITHUB_OUTPUT"

      - name: QEMU, for booting the image we just built
        run: |
          sudo apt-get update -qq
          if [ "$(uname -m)" = "aarch64" ]; then
            sudo apt-get install -y -qq qemu-system-arm
          else
            sudo apt-get install -y -qq qemu-system-x86
          fi

      - name: Build and publish each image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          gh release create images --latest=false \
            --title "Guest images" \
            --notes "Guest images, one asset per image and host architecture. Not versioned with the CLI: they change only when a guest does.

          Install one with \`warmbox setup\` (the default image) or \`warmbox image pull <name>\`." \
            2>/dev/null || true
          for name in ${{ steps.which.outputs.names }}; do
            echo "=== $name (amd64)"
            ./warmbox image build "$name" --platform linux/amd64

            # Boot it before publishing it. This is the only step that would
            # have caught a guest that never comes up, a hypervisor flag QEMU
            # refuses, or a readiness gate that never fires — the failure modes
            # that reached users instead. No KVM on a runner, so the smoke test
            # falls back to software emulation.
            WARMBOX_BIN=./warmbox ./deploy/guest/smoke.sh "$name"

            asset="warmbox-image-$name-amd64.tar.zst"
            ./warmbox image pack "$name" -o "$asset"
            gh release upload images "$asset" "$asset.sha256" --clobber
          done

  arm64:
    # ubuntu-24.04-arm is GitHub's free arm64 runner, available on public
    # repositories. If it is ever unavailable, build on an Apple Silicon Mac
    # instead: ./warmbox image build <name> && ./warmbox image pack <name>, then
    # upload warmbox-image-<name>-arm64.tar.zst (+ .sha256) by hand.
    if: ${{ inputs.arch == 'arm64' || inputs.arch == 'both' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - run: go build -o warmbox ./cmd/warmbox

      - name: Ask the registry which images ship
        id: which
        run: |
          images="${{ inputs.images }}"
          if [ -z "$images" ]; then
            images="$(./warmbox image build --publishable | tr '\n' ' ')"
          fi
          echo "building: $images"
          echo "names=$images" >> "$GITHUB_OUTPUT"

      - name: QEMU, for booting the image we just built
        run: |
          sudo apt-get update -qq
          if [ "$(uname -m)" = "aarch64" ]; then
            sudo apt-get install -y -qq qemu-system-arm
          else
            sudo apt-get install -y -qq qemu-system-x86
          fi

      - name: Build and publish each image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          gh release create images --latest=false \
            --title "Guest images" \
            --notes "Guest images, one asset per image and host architecture. Not versioned with the CLI: they change only when a guest does.

          Install one with \`warmbox setup\` (the default image) or \`warmbox image pull <name>\`." \
            2>/dev/null || true
          for name in ${{ steps.which.outputs.names }}; do
            echo "=== $name (arm64)"
            ./warmbox image build "$name" --platform linux/arm64

            # Same reason as the amd64 job: an image is not published until it
            # has booted to a readiness callback on the machine that built it.
            WARMBOX_BIN=./warmbox ./deploy/guest/smoke.sh "$name"

            asset="warmbox-image-$name-arm64.tar.zst"
            ./warmbox image pack "$name" -o "$asset"
            gh release upload images "$asset" "$asset.sha256" --clobber
          done
