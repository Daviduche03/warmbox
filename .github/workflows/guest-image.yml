name: guest image

# Publishes the guest images to a fixed "images" release, one asset per
# architecture:
#
#   warmbox-image-<goarch>.tar.zst  (+ .sha256)
#
# The tag is deliberately not the version: the guest changes far less often than
# the CLI, and `warmbox setup` looks for these exact names, so a new release does
# not need ~800 MB re-uploaded. Run this only when the guest actually changes.
#
# Manual on purpose: the build takes ~15 minutes per architecture and a failure
# here must never be able to block a binary release.

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Which guest image(s) to build"
        required: true
        default: both
        type: choice
        options: [both, amd64, arm64]

permissions:
  contents: write

jobs:
  amd64:
    if: ${{ inputs.arch == 'amd64' || inputs.arch == 'both' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Builds vmlinux + initramfs.zst + rootfs.squashfs (+ overlay initramfs
      # and volume-base.img) into ~/.warmbox.
      - name: Build the guest image
        env:
          PLATFORM: linux/amd64
        run: ./deploy/guest/build.sh

      - name: Pack it (adds the .sha256 beside the archive)
        run: |
          go build -o warmbox ./cmd/warmbox
          ./warmbox image pack --builtin -o warmbox-image-amd64.tar.zst

      - name: Publish to the images release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create images \
            --title "Guest images" \
            --notes "Guest images for \`warmbox setup\`, one per host architecture. Not versioned with the CLI: they change only when the guest does." \
            2>/dev/null || true
          gh release upload images \
            warmbox-image-amd64.tar.zst \
            warmbox-image-amd64.tar.zst.sha256 \
            --clobber

  arm64:
    # ubuntu-24.04-arm is GitHub's free arm64 runner, available on public
    # repositories. If it is ever unavailable, build the arm64 image on an Apple
    # Silicon Mac instead — which is where the guest image already lives:
    #
    #   make image-pack VERSION=unused
    #   gh release upload images warmbox-image-arm64.tar.zst \
    #       warmbox-image-arm64.tar.zst.sha256
    if: ${{ inputs.arch == 'arm64' || inputs.arch == 'both' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build the guest image
        env:
          PLATFORM: linux/arm64
        run: ./deploy/guest/build.sh

      - name: Pack it (adds the .sha256 beside the archive)
        run: |
          go build -o warmbox ./cmd/warmbox
          ./warmbox image pack --builtin -o warmbox-image-arm64.tar.zst

      - name: Publish to the images release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create images \
            --title "Guest images" \
            --notes "Guest images for \`warmbox setup\`, one per host architecture. Not versioned with the CLI: they change only when the guest does." \
            2>/dev/null || true
          gh release upload images \
            warmbox-image-arm64.tar.zst \
            warmbox-image-arm64.tar.zst.sha256 \
            --clobber
